name: tests

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate JSON files
        run: |
          python -m json.tool _conf_schema.json > /dev/null
          test -f .astrbot-plugin/i18n/zh-CN.json && python -m json.tool .astrbot-plugin/i18n/zh-CN.json > /dev/null
          test -f .astrbot-plugin/i18n/en-US.json && python -m json.tool .astrbot-plugin/i18n/en-US.json > /dev/null
      - name: Compile Python sources
        run: python -m compileall -q main.py schedule_lite_core
      - name: Check dashboard scripts
        run: node --check pages/dashboard/app.js

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: static
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure CJK fonts (best effort)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          FONT="/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"
          if [ ! -f "$FONT" ]; then
            sudo timeout 120 apt-get update || true
            sudo timeout 90 apt-get install -y --no-install-recommends fonts-noto-cjk || echo "::warning::CJK 字体安装失败，图片渲染测试将跳过"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest tests -q
