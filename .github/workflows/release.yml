name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches metadata version
        run: |
          TAG="${GITHUB_REF_NAME}"
          META_VERSION="$(sed -n 's/^version: *//p' metadata.yaml | head -n1)"
          echo "tag=$TAG metadata=$META_VERSION"
          test "$TAG" = "$META_VERSION" || {
            echo "::error::tag 与 metadata.yaml 的 version 不一致"
            exit 1
          }
      - name: Build plugin ZIP
        run: python .github/build_zip.py astrbot_plugin_schedule_lite.zip
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: astrbot_plugin_schedule_lite.zip
          fail_on_unmatched_files: true
